<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Recover your Smart Mandi account password via email." />
  <meta name="theme-color" content="#009959" />
  <title>Reset Password — Smart Mandi Token System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600&display=swap" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
</head>
<body>

  <!-- OFFLINE BANNER -->
  <div id="offline-banner" class="offline-banner" role="alert" aria-live="polite">
    📡 You are offline — password reset requires connection
  </div>

  <!-- HEADER -->
  <header class="app-header" role="banner">
    <div class="container app-header__inner">
      <a href="index.html" class="app-header__brand">
        <div class="app-header__logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div>
          <div class="app-header__title">Smart Mandi System</div>
        </div>
      </a>
      <nav class="app-header__nav" aria-label="Main navigation">
        <a href="tracker.html" class="btn btn--secondary">Track Token</a>
        <a href="login.html" class="btn btn--secondary">Sign In</a>
      </nav>
    </div>
  </header>

  <!-- FORGOT PASSWORD CONTAINER -->
  <div class="login-page" style="min-height: calc(100vh - 180px);">
    <div class="login-card">
      <div class="login-card__header">
        <div class="login-card__logo icon-box icon-box--lg" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="login-card__title">Reset Password</h1>
        <p class="login-card__subtitle">Enter your email to receive a recovery link</p>
      </div>

      <div class="login-card__body">
        <div id="forgot-error" class="login-error" role="alert" aria-live="polite"></div>
        <div id="forgot-success" class="badge badge--success" style="display:none; margin-bottom:var(--spacing-16); width:100%; text-align:center; padding: var(--spacing-12);" role="status" aria-live="polite"></div>

        <form id="standalone-forgot-form" aria-label="Reset password form" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgot-email">Gmail / Email Address</label>
            <input
              type="email"
              id="forgot-email"
              class="form-input"
              placeholder="your.name@gmail.com"
              required
              autocomplete="email"
              aria-required="true"
            />
          </div>

          <button type="submit" id="forgot-submit-btn" class="btn btn--primary btn--lg btn--full" style="margin-bottom:var(--spacing-12);">
            Send Recovery Email
          </button>

          <a href="login.html" class="btn btn--secondary btn--full" style="text-align:center; text-decoration:none;">
            Back to Sign In
          </a>
        </form>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="app-footer" role="contentinfo">
    <div class="container" style="text-align:center;">
      <p>Smart Mandi Token System &nbsp;|&nbsp; <a href="tracker.html">Track Token</a></p>
      <p style="margin-top: var(--spacing-8); font-size: var(--text-caption);">
        Smart India Hackathon 2026 &nbsp;·&nbsp; Digital Agriculture Solution for Indian Farmers
      </p>
    </div>
  </footer>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- SCRIPTS -->
  <script src="js/firebase-config.js"></script>
  <script src="js/offline.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initOfflineSupport();

      const form = document.getElementById('standalone-forgot-form');
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      const submitBtn = document.getElementById('forgot-submit-btn');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('forgot-email').value.trim();

          if (errorEl) { errorEl.classList.remove('show'); errorEl.textContent = ''; }
          if (successEl) { successEl.style.display = 'none'; }

          if (!email || !email.includes('@')) {
            errorEl.textContent = 'Please enter a valid email address.';
            errorEl.classList.add('show');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending Recovery Email…';

          try {
            await window.auth.sendPasswordResetEmail(email);
            if (successEl) {
              successEl.textContent = `Password reset link sent to ${email}! Check your inbox.`;
              successEl.style.display = 'block';
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Recovery Email';
          } catch (err) {
            if (errorEl) {
              errorEl.textContent = err.message || 'Failed to send recovery email. Try again.';
              errorEl.classList.add('show');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Recovery Email';
          }
        });
      }
    });
  </script>
</body>
</html>
